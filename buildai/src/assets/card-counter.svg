      <stop offset="0" stop-color="#131A3D"/>
      <stop offset="1" stop-color="#0A1526"/>
    </linearGradient>
    <radialGradient id="cCntGlow" cx="0.72" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
