  </defs>
  <rect width="360" height="200" rx="18" fill="url(#cCntBg)"/>
  <rect width="360" height="200" rx="18" fill="url(#cCntGlow)"/>
  <g stroke="#2B3A6B" stroke-width="1" opacity="0.6">
