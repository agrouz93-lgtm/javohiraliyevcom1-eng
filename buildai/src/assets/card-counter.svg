      <rect x="132" y="140" width="56" height="26" rx="3"/>
      <rect x="194" y="140" width="56" height="26" rx="3"/>
      <rect x="101" y="110" width="56" height="26" rx="3"/>
      <rect x="163" y="110" width="56" height="26" rx="3"/>
      <rect x="132" y="80" width="56" height="26" rx="3"/>
