<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-label="Qurilish materiallari tasviri">
  <defs>
    <linearGradient id="cMatBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D1238"/>
      <stop offset="1" stop-color="#120E24"/>
    </linearGradient>
    <radialGradient id="cMatGlow" cx="0.7" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#9C5CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="200" rx="18" fill="url(#cMatBg)"/>
  <rect width="360" height="200" rx="18" fill="url(#cMatGlow)"/>
  <g stroke="#3A2B66" stroke-width="1" opacity="0.55">
    <path d="M0 50 h360 M0 100 h360 M0 150 h360 M60 0 v200 M120 0 v200 M180 0 v200 M240 0 v200 M300 0 v200"/>
  </g>

  <!-- wood planks leaning -->
  <g transform="rotate(-14 96 118)">
    <rect x="56" y="70" width="18" height="118" rx="5" fill="#C08A4E" stroke="#8E5F2E" stroke-width="2"/>
    <rect x="80" y="70" width="18" height="118" rx="5" fill="#D89E5C" stroke="#8E5F2E" stroke-width="2"/>
    <path d="M60 92 h10 M60 130 h10 M84 106 h10 M84 154 h10" stroke="#8E5F2E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- brick stack -->
  <g stroke="#A5533A" stroke-width="2">
    <rect x="132" y="146" width="52" height="26" rx="3" fill="#C46A4A"/>
    <rect x="188" y="146" width="52" height="26" rx="3" fill="#C46A4A"/>
    <rect x="160" y="118" width="52" height="26" rx="3" fill="#CE7452"/>
    <rect x="132" y="118" width="26" height="26" rx="3" fill="#C46A4A"/>
    <rect x="214" y="118" width="26" height="26" rx="3" fill="#C46A4A"/>
    <rect x="160" y="90" width="52" height="26" rx="3" fill="#C46A4A"/>
  </g>

  <!-- cement bag -->
  <g>
    <path d="M254 92 h58 l6 78 a8 8 0 0 1 -8 9 h-54 a8 8 0 0 1 -8 -9 z" fill="#9AA9BC" stroke="#6E7E93" stroke-width="2"/>
    <rect x="252" y="118" width="64" height="20" fill="#1677FF"/>
    <text x="284" y="133" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">CEMENT</text>
    <path d="M262 96 h42" stroke="#6E7E93" stroke-width="3"/>
    <path d="M262 152 h44 M262 162 h34" stroke="#6E7E93" stroke-width="2"/>
  </g>

  <!-- cube icon accent -->
  <g transform="translate(46 34)" opacity="0.95">
    <path d="M0 14 L26 0 L52 14 L26 28 z" fill="#B98AFF"/>
    <path d="M0 14 L26 28 L26 56 L0 42 z" fill="#7C4DFF"/>
    <path d="M52 14 L26 28 L26 56 L52 42 z" fill="#9C5CFF"/>
  </g>
</svg>
