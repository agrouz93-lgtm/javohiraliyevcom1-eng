services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: usta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: usta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - usta_pg:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  usta_pg:
