<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animals Master</title>
<style>
:root{--ink:#0b2a5b;--c1:#fff;--c2:#d9efff;--hud:rgba(5,25,60,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8f4ff;--c1:#1d3d66;--c2:#12294a;--hud:rgba(2,12,32,.7);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e8f4ff;--c1:#1d3d66;--c2:#12294a;--hud:rgba(2,12,32,.7);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#fff;overflow:hidden;background:#2a6fb5}
.sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.au{animation:au 9s ease-in-out infinite alternate}
@keyframes au{from{transform:translateX(-18px);opacity:.75}to{transform:translateX(18px);opacity:1}}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.app{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.app>*{pointer-events:auto}
h1{font-size:clamp(20px,5vw,32px);margin-top:10px;text-shadow:0 3px 0 rgba(5,25,60,.8);text-align:center;padding:0 10px;pointer-events:none}
.bar,.lv{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center;padding:0 8px}
.chip{background:var(--hud);border:2px solid rgba(255,255,255,.5);border-radius:16px;padding:6px 14px;font-weight:700;font-size:clamp(13px,3.4vw,17px);text-align:center}
button{font:inherit;font-weight:800;color:#fff;background:linear-gradient(#ff9a3c,#f2650a);border:0;border-radius:16px;padding:8px 18px;cursor:pointer;box-shadow:0 4px 0 #a8420a;font-size:clamp(13px,3.4vw,17px)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a8420a}
.lv button{background:var(--hud);box-shadow:none;border:2px solid rgba(255,255,255,.5);padding:5px 12px;font-size:clamp(12px,3.1vw,15px)}
.lv button.on{background:linear-gradient(#ff9a3c,#f2650a);border-color:#fff}
.msg{margin-top:8px;font-size:clamp(13px,3.3vw,16px);background:var(--hud);padding:5px 14px;border-radius:14px;text-align:center;max-width:94vw;pointer-events:none}
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,20,50,.65);display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.card{background:linear-gradient(var(--c1),var(--c2));color:var(--ink);border-radius:26px;padding:26px 30px;text-align:center;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.card h2{font-size:30px;margin-bottom:8px}.card p{font-size:18px;margin:4px 0}.card button{margin-top:16px}
.home{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:16px;overflow:auto;background:var(--hb)}
.home.hide{display:none}
.ht{font-size:clamp(26px,7vw,46px);text-shadow:0 4px 0 var(--hsh,#0f3470);text-align:center}
.hs{font-size:clamp(15px,4vw,20px);color:#e8f4ff;font-weight:700;text-align:center}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;width:min(1100px,100%)}
@media(max-width:1000px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ac{background:rgba(255,255,255,.85);border:5px solid #fff;border-radius:26px;color:#0b2a5b;padding:10px 6px 12px;text-align:center;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 18px rgba(0,0,0,.15);transition:transform .2s;font-weight:800;font-size:clamp(15px,4vw,19px);transform:rotate(var(--r,0deg))}
.ac:hover{transform:translateY(-6px) scale(1.06) rotate(0deg)}
.ac img{width:100%;max-width:110px;aspect-ratio:240/260;object-fit:contain;display:block;margin:0 auto 4px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.ac span{display:inline-block;background:#fff;border-radius:12px;padding:2px 14px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:30;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.home>:not(.flake):not(.bgs):not(.santa):not(.gear){position:relative;z-index:1}
.bgs{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.santa{position:fixed;top:12vh;left:0;width:clamp(210px,34vw,360px);z-index:0;pointer-events:none;transform:translateX(-120%);animation:sf 10s linear infinite}
@keyframes sf{0%{transform:translateX(-120%)}55%,100%{transform:translateX(calc(100vw + 20px))}}
.sb{animation:sbob 1.2s ease-in-out infinite alternate}
@keyframes sbob{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
.sm{transform-box:fill-box;transform-origin:center;opacity:0;animation:smk 3.2s ease-out infinite}
@keyframes smk{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.85}100%{transform:translate(20px,-64px) scale(2.1);opacity:0}}
.flake{position:fixed;top:-12px;z-index:0;pointer-events:none;background:#fff;border-radius:50%;opacity:.85;animation:fl linear infinite}
@keyframes fl{to{transform:translate(var(--dx),108vh)}}@keyframes fl3{0%{opacity:0}12%{opacity:.9}to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:.25}}
@media(prefers-reduced-motion:reduce){.conf,.flake,.santa,.sm{display:none}.au{animation:none}}
.home{--hb:linear-gradient(#1d4a8f,#6ea8e0 45%,#e8f5ff);--hsh:#0f3470;--m1:#9dbfe6;--m2:#7ea8da;--h1:#f4f9ff;--h2:#fff;--p1:#1f5a46;--p2:#256b53;--pcap:#fff;--rf:#fff;--rfs:#c9d9ee;--mcap:#fff;--fl1:#fff;--fl2:#fff}
.home[data-s=bahor]{--hb:linear-gradient(#58b4ee,#a8dcf5 45%,#eafff0);--hsh:#1a6a9a;--m1:#a9cfe0;--m2:#8fc0a8;--h1:#86d65f;--h2:#6cc84a;--p1:#3fa24a;--p2:#4fb35a;--pcap:#ffc2dc;--rf:#c8553d;--rfs:#a8402c;--fl1:#ff8fb8;--fl2:#fff3a0;--cnd:none;--trd:inline;--b1:#ff8fb8;--b2:#fff}
.home[data-s=yoz]{--hb:linear-gradient(#2a86e8,#6ec0ff 45%,#fff6c8);--hsh:#1a5aa0;--m1:#9ab9d9;--m2:#7fae8c;--h1:#8fdc5a;--h2:#78cc44;--p1:#2e8b3a;--p2:#3a9a46;--pcap:#4bc457;--rf:#b84a32;--rfs:#923a28;--fl1:#ffd23f;--fl2:#ff6b6b;--cnd:none;--trd:inline;--b1:#d7261e;--b2:#f2c01c}
.home[data-s=kuz]{--hb:linear-gradient(#d9602a,#f4a468 45%,#fff0d0);--hsh:#8a3a10;--m1:#d2a98a;--m2:#b98a62;--h1:#e0b862;--h2:#d4a64c;--p1:#c2561e;--p2:#d9731e;--pcap:#f2b42e;--rf:#8a3b2a;--rfs:#6a2a1c;--fl1:#ff8a1f;--fl2:#c0392b;--cnd:none;--trd:inline;--b1:#f2b42e;--b2:#b3301f}
.cnf{display:var(--cnd,inline)}.rtr{display:var(--trd,none)}.bl1{fill:var(--b1,#ff8fb8);display:var(--bd,inline)}.bl2{fill:var(--b2,#fff);display:var(--bd,inline)}.m1{fill:var(--m1)}.m2{fill:var(--m2)}.h1{fill:var(--h1)}.h2{fill:var(--h2)}.p1{fill:var(--p1)}.p2{fill:var(--p2)}.pc{fill:var(--pcap)}.mc{fill:var(--mcap)}.rf{fill:var(--rf);stroke:var(--rfs);stroke-width:3}
.home[data-s=yoz] .mc,.home[data-s=kuz] .mc{display:none}
.so,.fl,.sfl{display:none}.home[data-s=bahor] .sfl{display:block}
.home[data-s]:not([data-s=qish]) .so,.home[data-s]:not([data-s=qish]) .fl{display:block}
.home[data-s]:not([data-s=qish]) .wo,.home[data-s]:not([data-s=qish]) .santa{display:none}
body[data-s]:not([data-s=qish]) .sky .so{display:block}
body[data-s]:not([data-s=qish]) .sky .wo{display:none}
.cl{animation:cl 80s linear infinite}
@keyframes cl{from{transform:translateX(-260px)}to{transform:translateX(1060px)}}
.gear{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:5;padding:8px 14px;font-size:22px;line-height:1}
.sb2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sb2 button{margin-top:0;background:rgba(255,255,255,.75);color:#0b2a5b;box-shadow:0 3px 0 rgba(0,0,0,.18);border:3px solid transparent;font-size:18px;padding:12px 10px}
.sb2 button.on{border-color:#ff8a1f;background:#fff}.sb2.lg{grid-template-columns:repeat(3,1fr);gap:10px}.sb2.lg button{font-size:16px;padding:10px 6px}
.sb2 button span{display:block;font-size:34px;line-height:1.2}
.home[data-s]:not([data-s=qish]) .sm{display:none}
@media(prefers-reduced-motion:reduce){.cl{animation:none}}
#st .card{max-height:92vh;overflow:auto}#howT{font-weight:800;margin-top:12px}
.msg:empty{display:none}
</style>
</head>

if(k<1)return requestAnimationFrame(step);
A.rotation.z=B.rotation.z=0;A.userData.fly=B.userData.fly=0;
[arr[a],arr[b]]=[arr[b],arr[a]];[gs[a],gs[b]]=[gs[b],gs[a]];moves++;$("mv").textContent=moves;busy=false;
